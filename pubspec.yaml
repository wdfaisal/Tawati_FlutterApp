name: tawati_mobile
description: "Tawati — منصة العائلة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  socket_io_client: ^3.0.2
  flutter_stripe: ^11.5.0
  local_auth: ^2.3.0
  flutter_quill: ^11.4.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1
  printing: ^5.13.4
  pdf: ^3.11.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/TawatiAppIcon.png"
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/images/TawatiAppIcon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
